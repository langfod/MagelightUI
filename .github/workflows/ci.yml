name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only PR runs supersede each other. A push to main must NOT cancel the previous
  # main run: that run is the one that seeds the shared vcpkg/SDK caches (~45 min
  # uncached).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  abi:
    name: ABI order check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_abi.py

  sdk:
    name: SDK packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: pack smoke (each tarball must build + contain dist)
        run: |
          for p in sdk react vite-plugin create-magelight-view; do
            echo "== $p =="
            (cd "packages/$p" && npm pack --dry-run > /dev/null) || exit 1
          done

  host:
    name: Host build + stage lint
    # windows-latest (VS 18 / MSVC 14.51) on purpose: that is the toolset the
    # maintainer machine updates to. fmt 9.1.0 could not compile there (its STL
    # dropped stdext::checked_array_iterator); the 2025-12 vcpkg baseline pins
    # fmt 12, which can.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Ultralight SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: extern/ul-sdk-2.0.0-beta.2-win-x64-free
          # Bump deliberately when moving to a new SDK build. A miss self-heals:
          # the fetch step downloads this pinned build from Ultralight's direct
          # download API (RELEASING.md section 2).
          key: ultralight-sdk-2.0.0-beta.2

      # A cache miss fetches the pinned build straight from Ultralight's download API
      # (https://ultralig.ht/download; extern/README.md): no manually hosted archive.
      - name: Fetch Ultralight SDK (direct download on a cache miss)
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $version = '2.0.0-beta.2'
          # ?format=json returns the package's own url/filename/hash, which is what
          # makes a cache miss self-sufficient: nothing to host, no token needed.
          $metaUrl = "https://ultralig.ht/api/v1/sdk/download?platform=windows-x64&version=$version&format=json"
          $meta = Invoke-RestMethod -Uri $metaUrl
          if (-not $meta.url) { throw "Ultralight download API returned no package for windows-x64/$version ($metaUrl)" }
          # The archive is a .7z (the page names it ul-sdk-<ver>-win-x64-free.7z);
          # 7-Zip on the runner extracts it below.
          $archive = 'ul-sdk.7z'
          Invoke-WebRequest -Uri $meta.url -OutFile $archive
          if (-not (Test-Path $archive)) { throw "SDK download from the Ultralight API produced no archive" }
          # The archive carries its own top-level folder; extract into extern/ so
          # that folder lands at extern/<archive name>/ (extern/README.md).
          7z x -oextern $archive | Out-Null
          Remove-Item $archive -ErrorAction SilentlyContinue
          $dir = 'extern/ul-sdk-2.0.0-beta.2-win-x64-free'
          if (-not (Test-Path "$dir/include")) { throw "SDK extract produced no $dir/include folder" }
          # build.ps1 checks this same pin; failing here means nothing is cached.
          $vf = "$dir/VERSION.txt"
          $v = if (Test-Path $vf) { "$(Get-Content $vf -Raw)".Trim() } else { '' }
          if ($v -ne '2.0.0-beta.2') {
            throw ("The downloaded SDK is Ultralight '$v', not the pinned 2.0.0-beta.2, so this job fails and " +
                   "caches nothing. Pack only an archive you have verified (RELEASING.md section 2), or move the " +
                   "pin on purpose.")
          }

      - name: Cache vcpkg dependencies
        uses: actions/cache@v4
        with:
          path: |
            C:\b\mgl\vcpkg_installed
            ~\AppData\Local\vcpkg\archives
          # The triplet is part of the key: the installed tree is named after it
          # (skyrim-x64-windows-release), so a triplet change must not reuse a
          # cache built for the old one.
          key: vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'ports/**', 'cmake/triplets/**') }}

      - name: Build + stage (build.ps1 → C:\b\mgl)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File build.ps1

      - name: Stage lint
        shell: pwsh
        # -NoPex: runners have no Papyrus compiler (it ships with the game);
        # release zips must still pass tools/check_stage.ps1 WITHOUT the switch.
        run: powershell -ExecutionPolicy Bypass -File tools/check_stage.ps1 -NoPex
