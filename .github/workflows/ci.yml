name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      sdk_url:
        description: 'Seeds the SDK cache. Ultralight 1.4.1 is a LOGIN-GATED dev build with no public CDN, so a maintainer must host the verified SDK archive privately and pass its URL here (RELEASING.md section 2)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only PR runs supersede each other. A push to main must NOT cancel the previous
  # main run: that run is the one that seeds the shared vcpkg/SDK caches (~45 min
  # uncached).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  abi:
    name: ABI order check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_abi.py

  sdk:
    name: SDK packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: pack smoke (each tarball must build + contain dist)
        run: |
          for p in sdk react vite-plugin create-magelight-view; do
            echo "== $p =="
            (cd "packages/$p" && npm pack --dry-run > /dev/null) || exit 1
          done

  host:
    name: Host build + stage lint
    # windows-latest (VS 18 / MSVC 14.51) on purpose: that is the toolset the
    # maintainer machine updates to. fmt 9.1.0 could not compile there (its STL
    # dropped stdext::checked_array_iterator); the 2025-12 vcpkg baseline pins
    # fmt 12, which can.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Ultralight SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: extern/ultralight-free-sdk-1.4.1-dev-win-x64
          # Bump deliberately when moving to a new SDK build. Ultralight 1.4.1 is
          # a login-gated dev build with NO public CDN, so this cache is the only
          # unattended source: see RELEASING.md section 2 to re-seed it.
          key: ultralight-sdk-1.4.1-263f6bd

      - name: Fetch Ultralight SDK (requires sdk_url — the build is login-gated)
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          SDK_URL: ${{ inputs.sdk_url }}
        run: |
          # Ultralight 1.4.1 comes only from a signed-in browser session at
          # https://ultralig.ht/download, so there is no CDN URL to fall back to:
          # a cache miss without an explicit sdk_url is a hard error with the
          # procedure, not a silent download of some other build.
          if (-not $env:SDK_URL) {
            throw ("The Ultralight SDK cache missed and no sdk_url was supplied. Ultralight 1.4.1-dev is a " +
                   "login-gated developer build (https://ultralig.ht/download) with no public CDN or token " +
                   "download, so CI cannot fetch it unattended. Re-seed the cache: a maintainer runs this " +
                   "workflow on main (Actions > CI > Run workflow) with sdk_url set to a privately hosted " +
                   "archive of a verified 1.4.1-263f6bd SDK. RELEASING.md section 2 has the procedure.")
          }
          $archive = 'ultralight-sdk.zip'
          curl -fL -o $archive $env:SDK_URL
          if ($LASTEXITCODE -ne 0) { throw "SDK download failed from sdk_url (HTTP $LASTEXITCODE)" }
          # The archive carries its own top-level folder; extract into extern/ so
          # that folder lands at extern/<archive name>/ (extern/README.md).
          7z x -oextern $archive | Out-Null
          Remove-Item $archive -ErrorAction SilentlyContinue
          $dir = 'extern/ultralight-free-sdk-1.4.1-dev-win-x64'
          if (-not (Test-Path "$dir/include")) { throw "SDK extract produced no $dir/include folder" }
          # build.ps1 checks this same pin; failing here means nothing is cached.
          $vf = "$dir/VERSION.txt"
          $v = if (Test-Path $vf) { "$(Get-Content $vf -Raw)".Trim() } else { '' }
          if ($v -ne '1.4.1-263f6bd') {
            throw ("The downloaded SDK is Ultralight '$v', not the pinned 1.4.1-263f6bd, so this job fails and " +
                   "caches nothing. Pack only an archive you have verified (RELEASING.md section 2), or move the " +
                   "pin on purpose.")
          }

      - name: Cache vcpkg dependencies
        uses: actions/cache@v4
        with:
          path: |
            C:\b\mgl\vcpkg_installed
            ~\AppData\Local\vcpkg\archives
          # The triplet is part of the key: the installed tree is named after it
          # (skyrim-x64-windows-release), so a triplet change must not reuse a
          # cache built for the old one.
          key: vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'ports/**', 'cmake/triplets/**') }}

      - name: Build + stage (build.ps1 → C:\b\mgl)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File build.ps1

      - name: Stage lint
        shell: pwsh
        # -NoPex: runners have no Papyrus compiler (it ships with the game);
        # release zips must still pass tools/check_stage.ps1 WITHOUT the switch.
        run: powershell -ExecutionPolicy Bypass -File tools/check_stage.ps1 -NoPex
